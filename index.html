function qrUrl(text,size){return new Promise(function(res){
  if(typeof QRCode==='undefined'){res(null);return}
  var box=document.createElement('div');
  try{new QRCode(box,{text:text,width:size,height:size,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){res(null);return}
  setTimeout(function(){var cv=box.querySelector('canvas');var im=box.querySelector('img');res(cv?cv.toDataURL('image/png'):(im&&im.src)||null)},0)})}
function dataBlob(u){var b=atob(u.split(',')[1]);var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/png'})}
async function saveQr(text,name){
  try{var u=await qrUrl(text,640);if(!u){toast('QR code is not available right now');return}
    var dl=await claude.use('downloads');if(!dl){toast('Saving files is not available here. Right-click the QR to save it.');return}
    await dl.save({filename:name,data:dataBlob(u)})}catch(e){if(!e||e.code!=='declined')toast('Could not save the QR code')}
}

function valid(o){return o.status!=='Cancelled'}
function tabOverview(){
  var P=work().products;var os=state.orders.filter(valid);
  var rev=os.reduce(function(a,o){return a+(o.total||0)},0);
  var units=os.reduce(function(a,o){return a+(o.items||[]).reduce(function(b,i){return b+i.q},0)},0);
  var lowL=P.filter(function(p){return p.available!==false&&p.stock<=5});
  var days=[];var now=new Date();now.setHours(0,0,0,0);
  for(var i=13;i>=0;i--){var d=new Date(now);d.setDate(now.getDate()-i);days.push({d:d,t:0,k:d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()})}
  os.forEach(function(o){var d=new Date(o.ts);var k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();var x=days.find(function(y){return y.k===k});if(x)x.t+=o.total||0});
  var mx=Math.max.apply(null,days.map(function(x){return x.t}).concat([1]));

function setView(){route(false)}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');if(!a)return;var k=a.dataset.a;
  if(a.tagName==='SELECT'||(a.tagName==='INPUT'&&a.type!=='button'))return;
  var id=a.dataset.id;
  switch(k){
  case 'cart-open':state.checkout=false;state.sent=null;openCart();break;
  case 'cart-close':closeCart();break;
  case 'inc':state.cart[+a.dataset.i].q++;saveCart();drawer();drawHeader();break;
  case 'dec':var l=state.cart[+a.dataset.i];l.q=Math.max(1,l.q-1);saveCart();drawer();drawHeader();break;
  case 'rm':state.cart.splice(+a.dataset.i,1);saveCart();drawer();drawHeader();break;
  case 'checkout':state.checkout=true;drawer();break;
  case 'back':state.checkout=false;drawer();break;
  case 'done':state.sent=null;state.checkout=false;closeCart();break;
  case 'copy-order':copy(state.sent.text,'Order message copied');break;
  case 'fav':e.preventDefault();var i=state.fav.indexOf(id);if(i>-1)state.fav.splice(i,1);else state.fav.push(id);ls.set('fav',state.fav);toast(i>-1?'Removed from favourites':'Saved to favourites');route(false);break;
  case 'card-sw':state.card[id]=+a.dataset.c;var p=prod(id);var old=$('#card-'+id);if(old&&p){var tmp=document.createElement('div');tmp.innerHTML=cardV(p);old.replaceWith(tmp.firstChild)}break;
  case 'color':state.pv.c=+a.dataset.c;state.pv.view='art';route(false);break;
  case 'view':state.pv.view='photo';route(false);break;
  case 'size':state.pv.s=a.dataset.v;state.sizeErr=false;route(false);break;
  case 'add':var pp=prod(state.pv.id);if(!state.pv.s){state.sizeErr=true;route(false);var er=$('#sizeerr');if(er)er.scrollIntoView({block:'center',behavior:'smooth'});break}
    var ex=state.cart.find(function(x){return x.id===pp.id&&x.c===state.pv.c&&x.s===state.pv.s});if(ex)ex.q++;else state.cart.push({id:pp.id,c:state.pv.c,s:state.pv.s,q:1});saveCart();drawHeader();state.checkout=false;state.sent=null;openCart();break;
  case 'copy-link':copy(shareLink(id),'Product link copied');break;
  case 'qr':var box=$('#qr-'+id);if(box.firstChild){box.innerHTML='';break}box.innerHTML='<div class="qrbox"><img alt="QR code" id="qrimg-'+id+'"><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="note">Scan to open this product.</span><button class="btn sm" data-a="qr-save" data-link="'+id+'">Save QR</button></div></div>';qrUrl(shareLink(id),300).then(function(u){var im=$('#qrimg-'+id);if(im&&u)im.src=u});break;
  case 'sub':state.f.sub=a.dataset.v;route(false);break;
  case 'sizef':state.f.size=a.dataset.v;route(false);break;
  case 'reset-f':state.f.sub='all';state.f.size='all';route(false);break;
  case 'tab':state.tab=a.dataset.v;renderDashBody();break;
  case 'new-prod':openEditor(null);break;
  case 'edit-prod':openEditor(id);break;
  case 'avail':var q=work().products.find(function(x){return x.id===id});q.available=q.available===false;renderDashBody();break;
  case 'modal-close':$('#modal').classList.remove('open');break;
  case 'del-prod':if(a.dataset.sure){var W=work();W.products=W.products.filter(function(x){return x.id!==id});$('#modal').classList.remove('open');renderDashBody()}else{a.dataset.sure='1';a.textContent='Tap again to delete'}break;
  case 'photo-rm':state.ed.d.img='';$('#e-prev').textContent='Photo removed.';break;
  case 'log-order':openOrderForm();break;
  case 'o-add':var P=work().products;var pr=P.find(function(x){return x.id===$('#o-pr').value});var qn=Math.max(1,Math.round(Number($('#o-q').value)||1));state.lines.push({pid:pr.id,name:pr.name,color:(pr.colors[+$('#o-co').value]||pr.colors[0]).n,size:$('#o-sz').value,q:qn,price:pr.price});drawLines();break;
  case 'o-rm':state.lines.splice(+a.dataset.i,1);drawLines();break;
  case 'del-order':if(a.dataset.sure){removeOrder(id)}else{a.dataset.sure='1';a.textContent='Tap again'}break;
  case 'clear-samples':Promise.all(state.orders.filter(function(o){return o.sample}).map(function(o){return removeOrder(o.id)})).then(function(){toast('Sample orders removed')});break;
  case 'qr-save':var lk=a.dataset.link;saveQr(lk?shareLink(lk):baseLink(),(lk?'qr-'+lk:'qr-store')+'.png');break;
  case 'qr-copy':var lk2=a.dataset.link;copy(lk2?shareLink(lk2):baseLink(),'Link copied');break;
  case 'publish':publishNow();break;
  case 'discard':state.draft=null;renderDashBody();toast('Changes discarded');break;
  }
});
document.addEventListener('change',function(e){
  var a=e.target.closest('[data-a]');if(!a)return;var k=a.dataset.a;
  if(k==='sort'){state.f.sort=a.value;route(false)}
  else if(k==='stock'){var p=work().products.find(function(x){return x.id===a.dataset.id});p.stock=Math.max(0,Math.round(Number(a.value)||0));updateBar()}
  else if(k==='status'){patchOrder(a.dataset.id,{status:a.value}).then(function(){toast('Status updated')},function(){toast('Could not update the order')})}
  else if(k==='e-cat'){var cat=a.value;$('#e-art').innerHTML=artOpts(cat,'');syncSub();if(!state.ed.orig){$('#e-sz').value=SIZES[cat].join(', ')}}
  else if(k==='o-prod'){fillOrderOpts()}
  else if(k==='photo'){var f=a.files&&a.files[0];if(!f)return;readPhoto(f).then(function(u){state.ed.d.img=u;$('#e-prev').innerHTML='Photo added. <button type="button" class="lnk" data-a="photo-rm">Remove</button>'},function(){toast('Could not read that image')})}
});
document.addEventListener('input',function(e){
  var a=e.target.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='setting'){work().store[a.dataset.k]=a.value;updateBar()}
  else if(a.dataset.a==='baseurl'){work().store.baseUrl=a.value.trim();updateBar()}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  if(k==='order'){var fd=new FormData(f);var o=buildOrder({n:String(fd.get('n')).trim(),p:String(fd.get('p')).trim(),a:String(fd.get('a')).trim(),t:String(fd.get('t')||'').trim()});state.sent=o;state.cart=[];saveCart();drawHeader();drawer()}
  else if(k==='product'){saveProduct(f)}
  else if(k==='order-log'){saveLoggedOrder(f)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeCart();$('#modal').classList.remove('open')}});
window.addEventListener('hashchange',function(){route(true)});

shell();route(false);initCaps().then(function(){state.access=true;if(state.r&&state.r.v==='dash')route(false)});
})();
</script>
